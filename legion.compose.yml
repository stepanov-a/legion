x-defaults: &defaults
  networks:
    - legion-net

networks:
  legion-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16

services:
  legion:
    <<: *defaults
    image: oven/bun:1.3
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      LEGION_PROJECT_DIR: /legion
      ZULIP_URL: "${ZULIP_URL:-https://legion-zulip-1:443}"
      S3_ENDPOINT: "${S3_ENDPOINT:-http://host.docker.internal:59000}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:?}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?}"
      S3_BUCKET: "${S3_BUCKET:-legion-bots}"
      RAGFLOW_API: "${RAGFLOW_API:-http://host.docker.internal:59380}"
      RAGFLOW_TOKEN: "${RAGFLOW_TOKEN:?}"
      # ТЕХДОЛГ: проверка TLS отключена (внутренние самоподписанные сертификаты
      # ragflow/s3-хранилищ). Убрать после перевода зависимостей на нормальные CA.
      NODE_TLS_REJECT_UNAUTHORIZED: "${NODE_TLS_REJECT_UNAUTHORIZED:-0}"
      OPENCODE_SERVER_PASSWORD: "${OPENCODE_SERVER_PASSWORD:?}"
      OPENCODE_PRINT_LOGS: "1"
      DEFAULT_MODEL: "${DEFAULT_MODEL:-nti/deepseek-v4-flash}"
    volumes:
      - ./:/legion
    working_dir: /legion/packages/opencode
    command:
      - sh
      - -c
      - |
        bun run ./src/index.ts serve --port 3000 --hostname 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
