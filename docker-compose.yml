# Unified Legion инфраструктура: Zulip + MinIO + RagFlow + Legion
# Все сервисы на одной сети — видят друг друга по service name.
# Запуск: docker compose up -d

x-defaults: &defaults
  networks:
    - legion-net

networks:
  legion-net:
    driver: bridge

volumes:
  # Zulip
  zulip-postgres:
  zulip-rabbitmq:
  zulip-redis:
  zulip-data:
  # MinIO
  minio-data:
  # RagFlow
  esdata01:
  mysql_data:
  redis_data:

secrets:
  zulip__postgres_password:
    file: ./debug/secrets/zulip__postgres_password
  zulip__memcached_password:
    file: ./debug/secrets/zulip__memcached_password
  zulip__rabbitmq_password:
    file: ./debug/secrets/zulip__rabbitmq_password
  zulip__redis_password:
    file: ./debug/secrets/zulip__redis_password
  zulip__secret_key:
    file: ./debug/secrets/zulip__secret_key
  zulip__email_password:
    file: ./debug/secrets/zulip__email_password

services:
  # ═══════════════════════════════════════════════════════════════
  # ZULIP
  # ═══════════════════════════════════════════════════════════════
  zulip-database:
    <<: *defaults
    image: "zulip/zulip-postgresql:14"
    restart: unless-stopped
    secrets:
      - zulip__postgres_password
    environment:
      POSTGRES_DB: "zulip"
      POSTGRES_USER: "zulip"
      POSTGRES_PASSWORD_FILE: /run/secrets/zulip__postgres_password
    volumes:
      - "zulip-postgres:/var/lib/postgresql/data:rw"
    attach: false

  zulip-memcached:
    <<: *defaults
    image: "memcached:alpine"
    restart: unless-stopped
    secrets:
      - zulip__memcached_password
    environment: &memcached-env
      SASL_CONF_PATH: "/home/memcache/memcached.conf"
      MEMCACHED_SASL_PWDB: "/home/memcache/memcached-sasl-db"
      MEMCACHED_PASSWORD_FILE: /run/secrets/zulip__memcached_password
    command:
      - "sh"
      - "-euc"
      - |
        echo 'mech_list: plain' > "$$SASL_CONF_PATH"
        echo "zulip@$$HOSTNAME:$$(cat $$MEMCACHED_PASSWORD_FILE)" > "$$MEMCACHED_SASL_PWDB"
        echo "zulip@localhost:$$(cat $$MEMCACHED_PASSWORD_FILE)" >> "$$MEMCACHED_SASL_PWDB"
        exec memcached -S
    attach: false

  zulip-rabbitmq:
    <<: *defaults
    image: "rabbitmq:4.2"
    restart: unless-stopped
    secrets:
      - zulip__rabbitmq_password
    environment: &rabbitmq-env
      RABBITMQ_DEFAULT_USER: "zulip"
      RABBITMQ_PASSWORD_FILE: /run/secrets/zulip__rabbitmq_password
    volumes:
      - "zulip-rabbitmq:/var/lib/rabbitmq:rw"
    command:
      - "sh"
      - "-euc"
      - |
        export RABBITMQ_DEFAULT_PASS="$$(cat $$RABBITMQ_PASSWORD_FILE)"
        echo "default_user = $$RABBITMQ_DEFAULT_USER" >> /etc/rabbitmq/rabbitmq.conf
        echo "default_pass = $$RABBITMQ_DEFAULT_PASS" >> /etc/rabbitmq/rabbitmq.conf
        exec docker-entrypoint.sh rabbitmq-server
    attach: false

  zulip-redis:
    <<: *defaults
    image: "redis:alpine"
    restart: unless-stopped
    secrets:
      - zulip__redis_password
    environment: &redis-env
      REDIS_PASSWORD_FILE: /run/secrets/zulip__redis_password
    volumes:
      - "zulip-redis:/data:rw"
    command:
      - "sh"
      - "-euc"
      - '/usr/local/bin/docker-entrypoint.sh --requirepass "$$(cat $$REDIS_PASSWORD_FILE)"'
    attach: false

  zulip:
    <<: *defaults
    image: "ghcr.io/zulip/zulip-server:12.1-0"
    restart: unless-stopped
    ports:
      - "${ZULIP_HTTP_PORT:-8080}:80"
      - "${ZULIP_HTTPS_PORT:-8443}:443"
    extra_hosts:
      - "legion.local:172.18.0.10"
    secrets:
      - zulip__postgres_password
      - zulip__memcached_password
      - zulip__rabbitmq_password
      - zulip__redis_password
      - zulip__secret_key
      - zulip__email_password
    environment:
      SETTING_EXTERNAL_HOST: "${ZULIP_EXTERNAL_HOST:-zulip.local:8443}"
      SETTING_ZULIP_ADMINISTRATOR: "${ZULIP_ADMIN_EMAIL}"
      SETTING_REMOTE_POSTGRES_HOST: "zulip-database"
      SETTING_MEMCACHED_LOCATION: "zulip-memcached:11211"
      SETTING_RABBITMQ_HOST: "zulip-rabbitmq"
      SETTING_REDIS_HOST: "zulip-redis"
      LOADBALANCER_IPS: "${LOADBALANCER_IPS:-172.18.0.0/16}"
      SETTING_OUTGOING_WEBHOOK_TIMEOUT_SECONDS: "${ZULIP_WEBHOOK_TIMEOUT:-60}"
      CERTIFICATES: "self-signed"
      CONFIG_http_proxy__allow_ranges: "172.18.0.0/16"
    volumes:
      - "zulip-data:/data:rw"
    ulimits:
      nofile:
        soft: 1000000
        hard: 1048576
    depends_on:
      - zulip-database
      - zulip-memcached
      - zulip-rabbitmq
      - zulip-redis

  # ═══════════════════════════════════════════════════════════════
  # MINIO
  # ═══════════════════════════════════════════════════════════════
  minio:
    <<: *defaults
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - "minio-data:/data"

  minio-setup:
    <<: *defaults
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: "http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin}@minio:9000"
    entrypoint: >
      /bin/sh -c "
      mc mb local/${S3_BUCKET:-legion-bots} --ignore-existing &&
      mc mb local/ragflow --ignore-existing &&
      echo 'Buckets created'
      "

  # ═══════════════════════════════════════════════════════════════
  # RAGFLOW (dependencies)
  # ═══════════════════════════════════════════════════════════════
  es01:
    <<: *defaults
    image: elasticsearch:8.11.3
    profiles:
      - elasticsearch
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - "${ES_PORT:-1200}:9200"
    environment:
      - node.name=es01
      - ELASTIC_PASSWORD=infini_rag_flow
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - "cluster.routing.allocation.disk.watermark.low=5gb"
      - "cluster.routing.allocation.disk.watermark.high=3gb"
      - "cluster.routing.allocation.disk.watermark.flood_stage=2gb"
    mem_limit: ${MEM_LIMIT:-4g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:infini_rag_flow http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 60
    restart: unless-stopped

  mysql:
    <<: *defaults
    image: mysql:8.0.39
    environment:
      MYSQL_ROOT_PASSWORD: infini_rag_flow
    command:
      --max_connections=1000
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --tls_version="TLSv1.2,TLSv1.3"
      --init-file /data/application/init.sql
      --binlog_expire_logs_seconds=604800
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./debug/init.sql:/data/application/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-pinfini_rag_flow"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  redis:
    <<: *defaults
    image: valkey/valkey:8
    command: ["redis-server", "--requirepass", "infini_rag_flow", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "infini_rag_flow", "ping"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # RAGFLOW (server)
  # ═══════════════════════════════════════════════════════════════
  ragflow:
    <<: *defaults
    depends_on:
      mysql:
        condition: service_healthy
    image: infiniflow/ragflow:latest
    command:
      - --enable-adminserver
      - --enable-mcpserver
      - --init-superuser
      - --mcp-host=0.0.0.0
      - --mcp-port=9382
      - --mcp-base-url=http://127.0.0.1:9380
      - --mcp-script-path=/ragflow/mcp/server/server.py
      - --mcp-mode=self-host
      - --mcp-host-api-key=ragflow-6041ca5b878d5707f20b69eff2ac0334
    ports:
      - "80:80"
      - "443:443"
      - "9380:9380"
      - "9381:9381"
      - "9382:9382"
    volumes:
      - /home/neo/Projects/ragflow/docker/ragflow-logs:/ragflow/logs
      - /home/neo/Projects/ragflow/docker/nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      - /home/neo/Projects/ragflow/docker/nginx/proxy.conf:/etc/nginx/proxy.conf
      - /home/neo/Projects/ragflow/docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - /home/neo/Projects/ragflow/docker/service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - /home/neo/Projects/ragflow/docker/entrypoint.sh:/ragflow/entrypoint.sh
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════
  # LEGION (opencode server)
  # ═══════════════════════════════════════════════════════════════
  legion:
    <<: *defaults
    image: oven/bun:1.3
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      legion-net:
        ipv4_address: 172.18.0.10
    env_file: ./debug/.env
    environment:
      LEGION_PROJECT_DIR: /legion
      LEGION_ZULIP_URL: "https://zulip:443"
      ZULIP_URL: "https://zulip:443"
      S3_ENDPOINT: "http://minio:9000"
      RAGFLOW_API: "http://ragflow:9380"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      OPENCODE_SERVER_PASSWORD: "test"
      OPENCODE_PRINT_LOGS: "1"
    volumes:
      - /home/neo/Projects/legion_new/legion:/legion
      - ~/.local/share/opencode:/root/.local/share/opencode
      - ~/.config/opencode:/root/.config/opencode
    working_dir: /legion/packages/opencode
    command:
      - sh
      - -c
      - |
        bun run ./src/index.ts serve --port 3000 --hostname 0.0.0.0
    extra_hosts:
      - "zulip-ext:172.18.0.7"
    depends_on:
      - zulip
      - minio
